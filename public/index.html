<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>LLM Todo Agent</title>
</head>
<body>
  <h1>Todo</h1>
  <ul id="list"></ul>
  <input id="msg" placeholder="e.g. Remind me to work on OOPS tomorrow" size="50">
  <button id="send">Send</button>
  <p id="reply"></p>
  <script>
    async function loadTasks() {
      const res = await fetch("/api/tasks");
      const tasks = await res.json();

      const list = document.getElementById("list");
      list.innerHTML = "";

      for (const t of tasks) {
        const li = document.createElement("li");
        const status = t.completed ? "✅" : "⬜";
        const due = t.dueDate ? ` (due ${t.dueDate})` : "";
        li.textContent = `${status} ${t.title}${due}`;
        list.appendChild(li);
      }
    }
    loadTasks();
    async function sendMessage() {
    const input = document.getElementById("msg");
    const replyEl = document.getElementById("reply");
    const text = input.value.trim();
    if (!text) return;

    replyEl.textContent = "Thinking...";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      replyEl.textContent = data.reply || data.error;
    } catch (err) {
      replyEl.textContent = "Network error. Is the server running?";
    }

    input.value = "";
    loadTasks();
  }

  document.getElementById("send").addEventListener("click", sendMessage);
  document.getElementById("msg").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });
  </script>
</body>
</html>
