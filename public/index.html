<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Todo Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Todo Agent</h1>
    <p>Chat with the assistant to manage your tasks</p>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="panel-header">
        <h2>Your tasks</h2>
        <span id="task-count"></span>
      </div>
      <ul id="task-list"></ul>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Assistant</h2>
      </div>
      <div id="messages"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" autocomplete="off"
               placeholder="e.g. Remind me to work on OOPS tomorrow">
        <button id="send-btn" type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
